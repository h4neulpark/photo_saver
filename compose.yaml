x-backend: &backend
  image: photo-saver-backend
  build: ./backend
  environment: &backend-env
    PHOTO_SAVER_TIMEZONE: ${PHOTO_SAVER_TIMEZONE:-Asia/Seoul}
    INCOMING_DIR: ${INCOMING_DIR:-incoming}
    MANAGED_DIR: ${MANAGED_DIR:-managed}
  restart: unless-stopped

services:
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHOTO_SAVER_PORT:-8888}:80"
      - "${PHOTO_SAVER_LAN_IP:-127.0.0.1}:${PHOTO_SAVER_PORT:-8888}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - thumbnails:/thumbnails:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *backend
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *backend-env
      PHOTO_SAVER_HA_URL: ${PHOTO_SAVER_HA_URL:-}
      PHOTO_SAVER_HA_TOKEN: ${PHOTO_SAVER_HA_TOKEN:-}
      PHOTO_SAVER_HA_STALE_SECONDS: ${PHOTO_SAVER_HA_STALE_SECONDS:-0}
      PHOTO_SAVER_HA_SCRIPT_ENTITY: ${PHOTO_SAVER_HA_SCRIPT_ENTITY:-script.wake_omv}
      PHOTO_SAVER_HA_RUNNING_ENTITY: ${PHOTO_SAVER_HA_RUNNING_ENTITY:-binary_sensor.omv_running}
      PHOTO_SAVER_WAKE_TIMEOUT_SECONDS: ${PHOTO_SAVER_WAKE_TIMEOUT_SECONDS:-180}
      PHOTO_SAVER_HA_SHUTDOWN_SCRIPT_ENTITY: ${PHOTO_SAVER_HA_SHUTDOWN_SCRIPT_ENTITY:-}
      PHOTO_SAVER_SHUTDOWN_TIMEOUT_SECONDS: ${PHOTO_SAVER_SHUTDOWN_TIMEOUT_SECONDS:-180}
      PHOTO_SAVER_STORAGE_USER: ${PHOTO_SAVER_STORAGE_USER:-}
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - catalog:/data
      - settings:/settings
      - thumbnails:/thumbnails
      - type: bind
        source: ${PHOTO_LIBRARY_ROOT:-.}/${INCOMING_DIR:-incoming}
        target: /incoming-preview
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PHOTO_LIBRARY_ROOT:-.}/${INCOMING_DIR:-incoming}
        target: /incoming-upload
        bind:
          create_host_path: false
      - type: bind
        source: ${PHOTO_LIBRARY_ROOT:-.}/${MANAGED_DIR:-managed}
        target: /managed-preview
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *backend-env
      PHOTO_SAVER_HA_URL: ${PHOTO_SAVER_HA_URL:-}
      PHOTO_SAVER_HA_TOKEN: ${PHOTO_SAVER_HA_TOKEN:-}
      PHOTO_SAVER_HA_STALE_SECONDS: ${PHOTO_SAVER_HA_STALE_SECONDS:-0}
      PHOTO_SAVER_HA_SCRIPT_ENTITY: ${PHOTO_SAVER_HA_SCRIPT_ENTITY:-script.wake_omv}
      PHOTO_SAVER_HA_RUNNING_ENTITY: ${PHOTO_SAVER_HA_RUNNING_ENTITY:-binary_sensor.omv_running}
      PHOTO_SAVER_WAKE_TIMEOUT_SECONDS: ${PHOTO_SAVER_WAKE_TIMEOUT_SECONDS:-180}
      PHOTO_SAVER_HA_SHUTDOWN_SCRIPT_ENTITY: ${PHOTO_SAVER_HA_SHUTDOWN_SCRIPT_ENTITY:-}
      PHOTO_SAVER_SHUTDOWN_TIMEOUT_SECONDS: ${PHOTO_SAVER_SHUTDOWN_TIMEOUT_SECONDS:-180}
      PHOTO_SAVER_STORAGE_USER: ${PHOTO_SAVER_STORAGE_USER:-}
    command: ["python", "worker.py"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - catalog:/data
      - thumbnails:/thumbnails
      - settings:/settings:ro
      - type: bind
        source: ${PHOTO_LIBRARY_ROOT:-.}
        target: /library
        bind:
          create_host_path: false

volumes:
  catalog:
  thumbnails:
  settings:
