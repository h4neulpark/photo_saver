server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        client_max_body_size 128m;
        set $catalog_api api:8000;
        proxy_pass http://$catalog_api;
        proxy_buffering off;
    }

    location /thumbnails/ {
        alias /thumbnails/;
    }
}
